name: Sync upstream stable release

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m5-upstream-sync
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'TR0MXI/zed'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - name: Check latest stable release and published assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/zed-industries/zed/releases/latest > "$RUNNER_TEMP/upstream.json"
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          upstream = json.loads((temporary / 'upstream.json').read_text())
          tag = upstream['tag_name']
          assert not upstream['draft'] and not upstream['prerelease']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), tag
          releases = [release for page in json.loads((temporary / 'releases.json').read_text()) for release in page]
          required = {'Zed-M5-Extreme.dmg', 'SHA256SUMS'}
          complete = any(
              release['tag_name'] == tag and not release['draft'] and not release['prerelease']
              and required.issubset({asset['name'] for asset in release['assets'] if asset['state'] == 'uploaded' and asset['size'] > 0})
              for release in releases
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nneeded={str(not complete).lower()}\n')
          PY

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    uses: ./.github/workflows/build-m5.yml
    with:
      upstream_tag: ${{ needs.check.outputs.tag }}
